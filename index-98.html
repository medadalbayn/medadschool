<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول الحصص والزووم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--txt:#1a1a2e;--muted:#6b7280;--accent:#4f46e5;--border:#e5e7eb;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1c1f26;--txt:#f0f0f2;--muted:#9aa0ac;--border:#2b2e36;}}
:root[data-theme="dark"]{--bg:#111318;--card:#1c1f26;--txt:#f0f0f2;--muted:#9aa0ac;--border:#2b2e36;}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100%}
header{padding:16px;background:linear-gradient(135deg,#2c4a7c,#4f46e5);color:#fff;text-align:center}
header img{width:60px;height:60px;border-radius:12px;background:#fff;padding:4px;display:block;margin:0 auto 8px}
header h1{margin:0;font-size:19px}
header p{margin:2px 0 0;font-size:12px;opacity:.9}
.tabs{display:flex;gap:6px;padding:10px;overflow-x:auto}
.tab{flex:1;text-align:center;padding:10px 6px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:14px;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrap{padding:14px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
select,input,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--txt);font-size:14px}
button{background:var(--accent);color:#fff;border:none;font-weight:bold;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.card table{width:100%;border-collapse:collapse;overflow-x:auto;display:block}
.card th,.card td{padding:14px 10px;border-bottom:1px solid var(--border);text-align:center;font-size:15px}
.card th{background:var(--accent);color:#fff;font-size:14px}
a.join{background:#16a34a;color:#fff;padding:9px 16px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:bold;display:inline-block}
.missing{color:var(--muted);font-size:12px}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
h3{margin:6px 0}
.del{background:#ef4444;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;top:0;right:0;left:0;width:100%;padding:10mm;background:#fff;color:#111;box-sizing:border-box}
  .pheader{text-align:center;border-bottom:4px solid #2c4a7c;padding-bottom:14px;margin-bottom:18px}
  .pheader img{width:120px}
  .pheader h2{color:#2c4a7c;margin:8px 0 2px;font-size:26px}
  .pheader p{margin:0;color:#555;font-size:16px}
  .pmeta{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:16px;font-size:20px}
  .ptable{width:100%;table-layout:fixed;border-collapse:collapse}
  .ptable th{background:#2c4a7c;color:#fff;padding:16px;font-size:18px}
  .ptable td{padding:18px;border:1px solid #ccc;text-align:center;font-size:18px;word-wrap:break-word}
  .ptable th:nth-child(1),.ptable td:nth-child(1){width:15%}
  .ptable th:nth-child(2),.ptable td:nth-child(2){width:35%}
  .ptable th:nth-child(3),.ptable td:nth-child(3){width:50%}
  .ptable a{color:#fff;background:#16a34a;font-weight:bold;text-decoration:none;padding:10px 22px;border-radius:8px;display:inline-block;font-size:17px}
}
</style>
</head>

let curTab='view';
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  if(t.dataset.tab==='admin'&&sessionStorage.getItem('isAdmin')!=='1'){
    const pass=prompt('كلمة سر الأدمن:');
    if(pass!==ADMIN_PASS){if(pass!==null)alert('كلمة السر غير صحيحة');return;}

  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');curTab=t.dataset.tab;render();
});

async function getClasses(){
  const {data,error}=await sb.from('schedule').select('class_name');
  if(error)return[];
  return [...new Set(data.map(r=>r.class_name))].sort();
}
async function getRows(filter={}){
  let q=sb.from('schedule').select('*').order('period_number');
  if(filter.class_name)q=q.eq('class_name',filter.class_name);
  if(filter.day)q=q.eq('day',filter.day);
  const {data,error}=await q;
  return error?[]:data;
}

async function render(){
  const p=new URLSearchParams(location.search);
  if(p.get('class')&&curTab!=='view'){curTab='view';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='view'));}
  if(curTab==='admin')return renderAdmin();
  if(curTab==='teacher')return renderTeacher();
  return renderView(p);
}

async function renderAdmin(){
  const classes=await getClasses();
  app.innerHTML=`
  <div class="card">
    <h3>➕ إضافة حصة للجدول</h3>
    <input id="a_class" list="classlist" placeholder="اسم الفصل (مثال: أول أ)">
    <datalist id="classlist">${classes.map(c=>`<option value="${c}">`).join('')}</datalist>
    <select id="a_day">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select>
    <div class="row2">
      <input id="a_period" type="number" min="1" placeholder="رقم الحصة">
      <input id="a_subject" placeholder="المادة">
    </div>
    <button id="a_add">إضافة</button>
  </div>
  <div class="card">
    <h3>📤 تصدير جدول فصل ليوم معين</h3>
    <p class="missing">✅ الأفضل: ابعت "رابط الطلاب" على واتساب — بيشتغل مع الكل من غير أي تعقيد. الـ PDF مناسب للطباعة الورقية بس.</p>
    <select id="e_class"><option value="">اختر الفصل</option>${classes.map(c=>`<option>${c}</option>`).join('')}</select>
    <select id="e_day">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select>
    <button id="e_go">🔗 إنشاء رابط للطلاب</button>
    <div id="e_out"></div>
    <button id="e_pdf" class="sec">🖨️ تصدير PDF للطباعة</button>
  </div>
  <div class="card" id="a_list"><h3>📋 كل حصص الجدول</h3><div id="a_table">جارٍ التحميل...</div></div>
  `;
  document.getElementById('a_add').onclick=async()=>{
    const class_name=document.getElementById('a_class').value.trim();
    const day=document.getElementById('a_day').value;
    const period_number=parseInt(document.getElementById('a_period').value);
    const subject=document.getElementById('a_subject').value.trim();
    if(!class_name||!period_number){alert('اكتب اسم الفصل ورقم الحصة');return;}
    const {error}=await sb.from('schedule').insert({class_name,day,period_number,subject});
    if(error){alert('خطأ: '+error.message);return;}
    renderAdmin();
  };
  document.getElementById('e_go').onclick=()=>{
    const c=document.getElementById('e_class').value,d=document.getElementById('e_day').value;
    if(!c){alert('اختر الفصل');return;}
    const url=location.origin+location.pathname+`?class=${encodeURIComponent(c)}&day=${encodeURIComponent(d)}`;
    document.getElementById('e_out').innerHTML=`
      <input value="${url}" readonly onclick="this.select()">
      <button class="sec" onclick="navigator.clipboard.writeText('${url}')">📋 نسخ الرابط</button>
      <button onclick="window.open('https://wa.me/?text='+encodeURIComponent('جدول فصل ${c} ليوم ${d} 📅\\n'+'${url}'))">📲 إرسال على واتساب</button>`;
  };
  document.getElementById('e_pdf').onclick=async()=>{
    const c=document.getElementById('e_class').value,d=document.getElementById('e_day').value;
    if(!c){alert('اختر الفصل');return;}
    const rows=await getRows({class_name:c,day:d});
    if(!rows.length){alert('لا توجد حصص لهذا الفصل واليوم');return;}
    document.getElementById('printArea').innerHTML=`
      <div class="pheader">
        <img src="${LOGO}">
        <h2>مدارس مداد البيان الأهلية</h2>
        <p>«بنين - بنات» — المرحلة الابتدائية</p>
      </div>
      <div class="pmeta"><span>الفصل: ${c}</span><span>اليوم: ${d}</span></div>
      <table class="ptable"><tr><th>الحصة</th><th>المادة</th><th>الرابط</th></tr>
      ${rows.map(r=>`<tr><td>${r.period_number}</td><td>${r.subject||'-'}</td><td>${r.zoom_url?`<a href="${r.zoom_url}">اضغط للدخول</a>`:'لم يرفع بعد'}</td></tr>`).join('')}
      </table>`;
    window.print();
  };
  const rows=await getRows();
  const tdiv=document.getElementById('a_table');
  if(!rows.length){tdiv.innerHTML='<p class="missing">لا توجد حصص بعد</p>';return;}
  tdiv.innerHTML=`<table><tr><th>الفصل</th><th>اليوم</th><th>الحصة</th><th>المادة</th><th>الزووم</th><th></th></tr>
  ${rows.map(r=>`<tr><td>${r.class_name}</td><td>${r.day}</td><td>${r.period_number}</td><td>${r.subject||'-'}</td>
  <td>${r.zoom_url?'✅':'—'}</td><td>
  ${r.zoom_url?`<button class="sec" data-clear="${r.id}">مسح الرابط</button>`:''}
  <button class="del" data-id="${r.id}">حذف الحصة</button>
  </td></tr>`).join('')}</table>`;
  tdiv.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{await sb.from('schedule').delete().eq('id',b.dataset.id);renderAdmin();});
  tdiv.querySelectorAll('[data-clear]').forEach(b=>b.onclick=async()=>{await sb.from('schedule').update({zoom_url:null}).eq('id',b.dataset.clear);renderAdmin();});
}

async function renderTeacher(){
  const classes=await getClasses();
  app.innerHTML=`
  <div class="card">
    <h3>رفع رابط زووم للحصة</h3>
    <select id="t_class"><option value="">اختر الفصل</option>${classes.map(c=>`<option>${c}</option>`).join('')}</select>
    <select id="t_day"><option value="">اختر اليوم</option>${DAYS.map(d=>`<option>${d}</option>`).join('')}</select>
    <select id="t_period"><option value="">اختر الحصة</option></select>
    <input id="t_url" placeholder="رابط الزووم">
    <button id="t_save">💾 حفظ الرابط</button>
    <p id="t_msg"></p>
  </div>`;
  async function loadPeriods(){
    const c=document.getElementById('t_class').value,d=document.getElementById('t_day').value;
    const sel=document.getElementById('t_period');
    sel.innerHTML='<option value="">اختر الحصة</option>';
    if(!c||!d)return;
    const rows=await getRows({class_name:c,day:d});
    rows.forEach(r=>sel.innerHTML+=`<option value="${r.id}">حصة ${r.period_number} - ${r.subject||''}</option>`);
  }
  document.getElementById('t_class').onchange=loadPeriods;
  document.getElementById('t_day').onchange=loadPeriods;
  document.getElementById('t_save').onclick=async()=>{
    const id=document.getElementById('t_period').value;
    const url=document.getElementById('t_url').value.trim();
    if(!id||!url){alert('اختر الحصة واكتب الرابط');return;}
    const {error}=await sb.from('schedule').update({zoom_url:url,updated_at:new Date().toISOString()}).eq('id',id);
    document.getElementById('t_msg').textContent=error?'خطأ: '+error.message:'✅ تم الحفظ';
  };
}

async function renderView(p){
  const classes=await getClasses();
  const preC=p.get('class')||'',preD=p.get('day')||'';
  app.innerHTML=`
  <div class="card">
    <select id="v_class"><option value="">اختر الفصل</option>${classes.map(c=>`<option ${c===preC?'selected':''}>${c}</option>`).join('')}</select>
    <select id="v_day"><option value="">اختر اليوم</option>${DAYS.map(d=>`<option ${d===preD?'selected':''}>${d}</option>`).join('')}</select>
  </div>
  <div id="v_table"></div>`;
  async function load(){
    const c=document.getElementById('v_class').value,d=document.getElementById('v_day').value;
    const t=document.getElementById('v_table');
    if(!c||!d){t.innerHTML='';return;}
    const rows=await getRows({class_name:c,day:d});
    if(!rows.length){t.innerHTML='<p class="missing">لا يوجد جدول لهذا الفصل واليوم</p>';return;}
    t.innerHTML=`<div class="card"><table><tr><th>الحصة</th><th>المادة</th><th>الزووم</th></tr>
    ${rows.map(r=>`<tr><td>${r.period_number}</td><td>${r.subject||'-'}</td><td>${r.zoom_url?`<a class="join" href="${r.zoom_url}" target="_blank">دخول</a>`:'<span class="missing">لم يرفع بعد</span>'}</td></tr>`).join('')}
    </table></div>`;
  }
  document.getElementById('v_class').onchange=load;
  document.getElementById('v_day').onchange=load;
  if(preC&&preD)load();
}

render();
</script>
